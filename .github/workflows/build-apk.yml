name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create required files
        run: |
          touch .env
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true" >> gradle.properties
          echo "ksp.incremental=false" >> gradle.properties
          echo "GEMINI_API_KEY=placeholder" >> .env.example

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /opt/gradle
          export PATH=$PATH:/opt/gradle/gradle-8.7/bin
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x validateSigningDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chispa-go-debug
          path: app/build/outputs/apk/debug/app-debug.apk
